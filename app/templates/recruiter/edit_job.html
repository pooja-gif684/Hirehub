{% extends "base.html" %}
{% block title %}Edit Job{% endblock %}
{% block content %}
<h2>Edit Job Posting</h2>
<form method="post" class="row g-3">
  <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" name="title" value="{{ job.title }}" required></div>
  <div class="col-md-6"><label class="form-label">Company</label><input class="form-control" name="company" value="{{ job.company }}" required></div>
  <div class="col-md-4"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ job.location }}" required></div>
  <div class="col-md-4"><label class="form-label">Type</label><input class="form-control" name="job_type" value="{{ job.job_type }}"></div>
  <div class="col-md-4"><label class="form-label">Salary</label><input class="form-control" name="salary" value="{{ job.salary }}"></div>
  <div class="col-md-6"><label class="form-label">Category</label><input class="form-control" name="category" value="{{ job.category }}"></div>
  <div class="col-md-6"><label class="form-label">Requirements (comma-separated)</label><input class="form-control" name="requirements" value="{{ job.requirements|join(', ') }}"></div>
  <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="6" required>{{ job.description }}</textarea></div>
  <div class="col-12"><button class="btn btn-primary">Save changes</button></div>
</form>
{% endblock %}
